<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Email Vault 50 Done-For-You Email Templates</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#F74FA0;
  --pink-light:#FF85C4;
  --pink-pale:#FFF0F7;
  --pink-border:#FFD0E8;
  --purple:#C070FF;
  --blue:#60C8FF;
  --yellow:#FFE600;
  --black:#1a1a1a;
  --off-white:#FFF8FC;
  --white:#fff;
  --muted:#888;
  --border:#FFD0E8;
}
html,body{height:100%;margin:0}
body{font-family:'Inter',sans-serif;background:var(--off-white);color:var(--black);display:flex;flex-direction:column;min-height:100vh}

/* ── HEADER ── */
.vault-header{background:linear-gradient(135deg,var(--pink) 0%,var(--purple) 55%,var(--blue) 100%);padding:20px 28px 0;flex-shrink:0}
.header-inner{max-width:1120px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.header-left{padding-bottom:18px}
.header-eyebrow{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.65);margin-bottom:5px}
.header-title{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;color:#fff;line-height:1;text-transform:uppercase;letter-spacing:-0.01em;text-shadow:2px 2px 0 rgba(0,0,0,0.12)}
.header-script{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:rgba(255,255,255,0.82);margin-top:4px}
.header-sticker{background:var(--yellow);color:var(--black);font-family:'Syne',sans-serif;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;padding:10px 12px;border-radius:4px;transform:rotate(2.5deg);flex-shrink:0;line-height:1.2;text-align:center;margin-bottom:14px;box-shadow:2px 2px 0 rgba(0,0,0,0.15)}
.header-sticker span{display:block;font-size:9px;letter-spacing:0.08em;opacity:0.75;margin-top:1px}

/* tape strip */
.tape-strip{height:6px;background:repeating-linear-gradient(90deg,var(--pink-border) 0px,var(--pink-border) 10px,var(--pink-light) 10px,var(--pink-light) 20px);flex-shrink:0}

/* ── CATEGORY PILLS ── */
.cats-bar{background:var(--white);border-bottom:2px dashed var(--pink-border);padding:10px 28px;flex-shrink:0;position:sticky;top:0;z-index:100}
.cats-inner{max-width:1120px;margin:0 auto;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;align-items:center}
.cats-inner::-webkit-scrollbar{display:none}
.cat-pill{flex-shrink:0;padding:6px 14px;border-radius:4px;font-size:10.5px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;border:2px solid transparent;transition:all 0.15s;font-family:'Syne',sans-serif;display:flex;align-items:center;gap:5px}
.cat-pill .pill-count{font-size:9px;opacity:0.65;font-family:'DM Mono',monospace}
.cat-pill.active .pill-count{opacity:1}
.cp-welcome{background:#FFF0F7;color:#c0207a;border-color:#FFB0D8}
.cp-welcome.active{background:var(--pink);color:#fff;border-color:var(--pink)}
.cp-collab{background:#F3EAFF;color:#7030C0;border-color:#D4A8F8}
.cp-collab.active{background:#9B40E8;color:#fff;border-color:#9B40E8}
.cp-nurture{background:#E8F4FF;color:#0055C0;border-color:#90C4F8}
.cp-nurture.active{background:#2070E0;color:#fff;border-color:#2070E0}
.cp-sales{background:#FFF5E0;color:#C05010;border-color:#FFCC80}
.cp-sales.active{background:#F08020;color:#fff;border-color:#F08020}
.cp-time{background:#E8FFF5;color:#006650;border-color:#80DEC0}
.cp-time.active{background:#10A878;color:#fff;border-color:#10A878}
.cp-reengage{background:#FFF0F0;color:#C02020;border-color:#FFB0B0}
.cp-reengage.active{background:#E03030;color:#fff;border-color:#E03030}

/* ── BODY LAYOUT ── */
.vault-body{max-width:1120px;margin:0 auto;padding:22px 28px 60px;display:grid;grid-template-columns:248px 1fr;gap:18px;align-items:start;width:100%}

/* ── TEMPLATE LIST (sidebar) ── */
.tpl-list-wrap{background:var(--white);border:2px dashed var(--pink-border);border-radius:10px;overflow:hidden;position:sticky;top:55px}
.tpl-list-head{padding:10px 14px;background:var(--pink-pale);border-bottom:2px dashed var(--pink-border);display:flex;align-items:center;justify-content:space-between}
.tpl-list-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--pink)}
.tpl-list-count{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted)}
.tpl-list{max-height:calc(100vh - 180px);overflow-y:auto}
.tpl-list::-webkit-scrollbar{width:3px}
.tpl-list::-webkit-scrollbar-thumb{background:var(--pink-border);border-radius:2px}
.tpl-row{padding:10px 14px;cursor:pointer;border-bottom:1px dashed var(--pink-border);border-left:3px solid transparent;transition:all 0.12s;display:flex;gap:9px;align-items:flex-start}
.tpl-row:last-child{border-bottom:none}
.tpl-row:hover{background:var(--pink-pale)}
.tpl-row.active{background:var(--pink-pale);border-left-color:var(--pink)}
.tpl-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--pink-border);flex-shrink:0;margin-top:1px;min-width:20px}
.tpl-row.active .tpl-num{color:var(--pink)}
.tpl-row-name{font-size:11.5px;font-weight:600;color:var(--black);line-height:1.35;margin-bottom:2px}
.tpl-row-hint{font-size:10px;color:var(--muted);line-height:1.35}

/* ── CONTENT PANEL ── */
.content-panel{}

/* cat intro card */
.cat-intro{background:var(--white);border:2px dashed var(--pink-border);border-radius:10px;padding:18px 22px;margin-bottom:16px;position:relative;overflow:hidden}
.cat-intro::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue))}
.cat-intro-title{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;color:var(--black);text-transform:uppercase;letter-spacing:0.02em;margin-bottom:3px}
.cat-intro-script{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--pink);margin-bottom:8px}
.cat-intro-desc{font-size:12.5px;color:#555;line-height:1.7}

/* template card */
.tpl-card{background:var(--white);border:2px dashed var(--pink-border);border-radius:10px;overflow:hidden}
.tpl-card-header{padding:18px 22px 16px;border-bottom:2px dashed var(--pink-border)}
.tpl-eyebrow{display:inline-block;background:var(--yellow);color:var(--black);font-family:'DM Mono',monospace;font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:0.1em;padding:2px 8px;border-radius:2px;margin-bottom:8px}
.tpl-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--black);text-transform:uppercase;letter-spacing:0.01em;line-height:1.1;margin-bottom:10px}
.when-block{background:var(--pink-pale);border-left:3px solid var(--pink);border-radius:0 6px 6px 0;padding:9px 13px;margin-bottom:14px;position:relative}
.when-label{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--pink);margin-bottom:4px}
.when-text{font-size:12px;color:#704050;line-height:1.65}
.subjects-block{background:#FFF8FD;border:1.5px dashed var(--pink-border);border-radius:6px;padding:11px 14px}
.subjects-label{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.subject-line{font-size:12.5px;color:var(--black);padding-left:14px;position:relative;margin-bottom:4px;line-height:1.5}
.subject-line:last-child{margin-bottom:0}
.subject-line::before{content:'★';position:absolute;left:0;color:var(--pink);font-size:9px;top:2px}

/* body */
.tpl-body{padding:20px 22px}
.tpl-text{font-size:13px;line-height:1.95;color:#2a2a2a;white-space:pre-wrap;word-break:break-word;font-weight:300}
.ph{background:rgba(247,79,160,0.10);color:#c0105a;border-radius:3px;padding:1px 4px;font-weight:500;font-size:12px;font-family:'DM Mono',monospace}

/* footer */
.tpl-footer{padding:13px 22px;border-top:2px dashed var(--pink-border);background:var(--pink-pale);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.copy-btn{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;border:none;border-radius:50px;padding:9px 22px;font-size:10.5px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;cursor:pointer;transition:opacity 0.15s;font-family:'Syne',sans-serif}
.copy-btn:hover{opacity:0.88}
.copy-btn.copied{background:linear-gradient(90deg,#10A878,#2070E0)}
.ph-note{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.ph-chip{background:rgba(247,79,160,0.1);color:#c0105a;border-radius:3px;padding:1px 6px;font-size:10px;font-family:'DM Mono',monospace;font-weight:500}

/* ── FOOTER ── */
.vault-footer{background:var(--black);margin-top:auto;flex-shrink:0}
.footer-inner{max-width:1120px;margin:0 auto;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.footer-logo{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:0.08em}
.footer-script{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;color:rgba(255,255,255,0.45);margin-top:2px}
.footer-links{display:flex;align-items:center;gap:10px}
.footer-links a{font-size:11.5px;color:var(--pink-light);text-decoration:none;letter-spacing:0.04em;transition:color 0.15s}
.footer-links a:hover{color:var(--pink)}
.footer-dot{color:rgba(255,255,255,0.2);font-size:9px}
.footer-right{text-align:right}
.footer-note{font-size:10.5px;color:rgba(255,255,255,0.3);line-height:1.6;font-family:'DM Mono',monospace}

@media(max-width:740px){
  .vault-body{grid-template-columns:1fr;padding:16px 16px 60px}
  .tpl-list-wrap{position:static}
  .tpl-list{max-height:none}
  .cats-bar{padding:10px 16px}
  .vault-header{padding:16px 16px 0}
  .header-inner{flex-direction:column;align-items:flex-start}
  .header-sticker{transform:none;margin-bottom:0;align-self:flex-end}
}
</style>
</head>
<body>

<header class="vault-header">
  <div class="header-inner">
    <div class="header-left">
      <div class="header-eyebrow">Kylie Kelly presents</div>
      <div class="header-title">The Email Vault</div>
      <div class="header-script">50 done-for-you email templates</div>
    </div>
    <div class="header-sticker">50 templates<span>inside ✦</span></div>
  </div>
</header>
<div class="tape-strip"></div>

<nav class="cats-bar" aria-label="Template categories">
  <div class="cats-inner" id="cats-inner"></div>
</nav>

<div class="vault-body" id="vault-body">
  <aside class="tpl-list-wrap" aria-label="Template list">
    <div class="tpl-list-head">
      <span class="tpl-list-label" id="list-label">Templates</span>
      <span class="tpl-list-count" id="list-count"></span>
    </div>
    <div class="tpl-list" id="tpl-list"></div>
  </aside>
  <main class="content-panel" id="content-panel" aria-live="polite"></main>
</div>

<script>
const CATS = [
  {
    id:'welcome',cls:'cp-welcome',emoji:'✉',label:'Welcome',count:6,
    title:'Welcome Sequence',script:'First impressions that actually stick',
    desc:'Everything your new subscribers need from freebie delivery to soft pitch. Use the full 4-email sequence, or grab the single Start Here email when you want simplicity without sacrificing warmth.',
    templates:[
      {name:'Start Here Email',hint:'Replaces full sequence',eyebrow:'Welcome · Single Email',
       when:'Use this when you want one powerful first impression instead of a multi-email sequence. Great for busy seasons or when simplicity is the goal.',
       subjects:['Start here [FIRST NAME]...'],
       body:`Hey [FIRST NAME],

If we haven't officially met yet I'm Kylie 👋

Visibility coach & audience growth expert, host of The Email Growth Show, proud Aussie mama to two wild little boys, and your new biz bestie cheering you on from a tiny town with a big heart (and strong coffee always in hand!)

I'm so damn happy you're here.

Since you just joined my email family cue the confetti 🎉 I wanted to give you a little behind-the-scenes peek at what you've signed up for.

Because I know your inbox is sacred.

Here's what to expect from me:

→ Emails 2–3 times a week with juicy email marketing + visibility strategies that actually work
→ Real talk on what's working (and what's not) in my business and with my clients
→ Invites to the good stuff: summits, bundles, masterclasses
→ Links to freebies + paid offers that help you build a business that works for you

[SIGNOFF]

P.S. I'm nosy in the best way how'd you find me? Summit? Bundle? A podcast episode you loved? Hit reply and tell me. I always wanna know how you landed here!`},
      {name:'Email #1: Delivery & Hello',hint:'Send immediately after opt-in',eyebrow:'Welcome Sequence · Email 1 of 4',
       when:'Send immediately after someone opts in. Deliver the freebie fast, introduce yourself warmly, and plant a seed for what\'s coming over the next few days.',
       subjects:["Here's your [FREEBIE NAME]: open for access 👀",'Open to access [YOUR FREEBIE NAME]',"Here's that [guide/template] you asked for!"],
       body:`Hey [FIRST NAME],

So excited you're here your [FREEBIE NAME] is ready for you:

[CLICK TO ACCESS → insert link here]

I created this to help you [QUICK BENEFIT e.g. "write a welcome sequence that actually connects" or "stop ghosting your list"].

I know how tempting it can be to grab a freebie and do nothing with it… so let's change that!

Oh, by the way I'm [YOUR NAME]. And if you only know one thing about me and this email list, it's that as much as I love [SOMETHING RELATABLE], I love the idea of [YOUR VISION FOR CLIENTS] even more.

Over the next few days, I'll share a few tips to help you [RESULT OR GOAL].

Can't wait to show you what's possible.

[SIGNOFF]

P.S. [ASK A SIMPLE YES/NO QUESTION HERE]? Seriously hit reply and let me know. I'd love to hear from you.`},
      {name:'Email #2: Story & Tip',hint:'Build connection with vulnerability',eyebrow:'Welcome Sequence · Email 2 of 4',
       when:'Send 1–2 days after Email #1. This is your trust-builder. A moment of real honesty goes further than any strategy tip.',
       subjects:['Can I share something real with you?','I used to feel so awkward sending this email…','When someone downloaded my freebie, I used to panic 😅'],
       body:`Hey [FIRST NAME],

There was a time when someone would grab my freebie and… that was it.

I'd freeze up.

I wanted to say something helpful. I wanted to connect.

But I didn't know what to say next or how to say it without feeling awkward.

If you've ever felt like that you're so not alone.

That's actually why I created [FREEBIE NAME]: to help you [WHAT IT HELPS THEM DO].

But more than that? I want to show up for you in a way that's real and helpful not just more noise in your inbox.

Here's a little reminder I come back to often:

Forget perfection. Just be real your people will feel it.

Whether we've just met or you've been following me for a while I'm here to support you.

Next time, I'll share what you can expect from me going forward!

Until then, breathe. You're doing better than you think.

[SIGNOFF]`},
      {name:'Email #3: What To Expect',hint:'Set the relationship up right',eyebrow:'Welcome Sequence · Email 3 of 4',
       when:'Send on day 3 or 4. Make it official tell them exactly what they signed up for, and what they won\'t get from you. The ❌ list builds trust fast.',
       subjects:["Here's what you can expect from me 💌",'So… what now? Let me tell you!',"You're officially in here's what that means"],
       body:`Hey [FIRST NAME],

Let's make this official, shall we?

Here's what you can expect now that you're part of my email fam:

→ Real, practical tips to help you [RESULT e.g. "grow your email list without dancing on Instagram"]
→ Behind-the-scenes of what I'm learning, testing, and teaching in real time
→ Free resources and occasional low-ticket offers that actually move the needle

Here's what you WON'T get from me:

❌ Fluff
❌ Fear-based marketing
❌ Emails for the sake of sending an email

This space is about real support, with strategies that actually feel good (and work).

If that sounds like your vibe, hit reply and type [FUN WORD e.g. "YAY"] so I know you're with me.

[SIGNOFF]

P.S. If you're someone who likes [WHAT YOUR OFFER IS ABOUT], you're going to love what's coming tomorrow 😏`},
      {name:'Email #4: Invitation & CTA',hint:'Soft-pitch your paid offer',eyebrow:'Welcome Sequence · Email 4 of 4',
       when:'The final email of your sequence. A warm, natural invitation not a hard sell. Position your paid offer as the logical next step for someone who loved the freebie.',
       subjects:['This might be your next best step…','Ready for more? Let\'s keep going →',"You've started strong here's what's next"],
       body:`Hey [FIRST NAME],

By now, you've hopefully had a chance to peek at [FREEBIE NAME] and get a little spark of momentum when it comes to [TOPIC/GOAL].

But if you're anything like me, once you start seeing progress, the next question is:

"Okay, what now?"

That's exactly where [PAID OFFER NAME] comes in.

It's designed to help you [MAIN RESULT e.g. "turn your subscribers into actual clients," "build consistent visibility without burning out"].

And since you've already taken the first step? I want to make your next one feel easy and low-pressure.

[INSERT SPECIAL OFFER, DISCOUNT, OR BONUS]

Whether you're just getting started or ready to expand, I'd love to support you inside.

This might be the exact nudge you've been looking for.

[SIGNOFF]

P.S. Not sure if it's the right time? No stress. Keep showing up your momentum matters more than perfection. And I'm always just an email away!`},
      {name:'Bundle-Friendly One-Email Welcome',hint:'For high-volume list growth seasons',eyebrow:'Welcome · Bundle / Summit Version',
       when:'Use during bundles, summits, or any high-volume opt-in season. One strong email that delivers the freebie, introduces you, and gives them a reason to stick around without overwhelming them.',
       subjects:['Welcome to [YOUR FREEBIE NAME] 🎉','Open to access [YOUR FREEBIE NAME]',"Here's that [guide/template] you asked for!"],
       body:`Hey [FIRST NAME],

Thank you so much for requesting access to [FREEBIE NAME]: I'm so thrilled to share it with you!

STEP 1: How to access your freebie

Download your [FREEBIE NAME] here: [INSERT LINK]

This [BRIEF DESCRIPTION e.g. guide, checklist, workbook] is designed to help you [SPECIFIC RESULT OR BENEFIT].

STEP 2: Bonus gift for you 🎁

Because I'm so excited to help you [SPECIFIC GOAL], here's another resource:

[BONUS RESOURCE NAME] [Brief description]

Grab it here: [INSERT LINK]

---

Wait who am I?

Hi 👋 I'm [YOUR NAME].

→ [Brief description of what you do]
→ I've worked with [NUMBER OR IMPRESSIVE RESULT]
→ My mission is to [YOUR MISSION]

You'll hear from me regularly with tips, strategies, and both free and paid resources to help you [THEIR MAIN GOAL].

Thank you for joining my community I'm so grateful to have you here!

[SIGNOFF]`},
    ]
  },
  {
    id:'collab',cls:'cp-collab',emoji:'🤝',label:'Collaboration',count:8,
    title:'Collaboration Emails',script:'Partnerships that feel genuinely good',
    desc:'Reach out for podcast swaps, freebie exchanges, and joint ventures without ever feeling like you\'re cold-pitching. These templates are warm, mutual, and genuinely fun to send.',
    templates:[
      {name:'Podcast Pitch',hint:'Guest pitch to a host you listen to',eyebrow:'Collaboration · Podcast Outreach',
       when:'Send to podcast hosts you genuinely follow. The more specific your episode reference, the higher your response rate. This is a conversation starter, not a CV submission.',
       subjects:['Podcast interview idea 🎙','Lurking fan… just binged your latest episode 😍','Wanna chat about [TOPIC] on your podcast?'],
       body:`Hi [HOST NAME],

Great show! I just finished listening to a few episodes. As a [YOUR INDUSTRY] business owner, I really connected with what you shared about [SPECIFIC EXAMPLE FROM A RECENT EPISODE].

If you're seeking guests, I'd love to contribute by discussing [YOUR TOPIC].

This is valuable to your listeners because [WHY IT MATTERS TO THEIR SPECIFIC AUDIENCE].

I can also share the interview with my [EMAIL LIST / SOCIAL FOLLOWING / NETWORK] I know my community would benefit from what you're building.

No pressure at all to have me as a guest it's 100% about adding value to your audience.

Looking forward to hearing from you,

[SIGNOFF]`},
      {name:'Podcast Pitch Follow-Up',hint:'Follow up if no reply after 7 days',eyebrow:'Collaboration · Podcast Follow-Up',
       when:'Send 7 days after your initial pitch if you haven\'t heard back. Keep it short, warm, and without pressure. One gentle nudge is enough.',
       subjects:['Just circling back no rush 🎙','Following up on my podcast idea…','Did this land in your inbox?'],
       body:`Hi [HOST NAME],

Just wanted to follow up on my note from last week in case it got buried in your inbox totally understand how full things get!

I'd still love to be considered as a guest on [PODCAST NAME] if the timing ever feels right. Happy to share my media kit or any other info that would help.

Either way, I'm a big fan of what you're creating keep up the incredible work!

[SIGNOFF]`},
      {name:'Freebie Swap Pitch',hint:'Propose a mutual list share',eyebrow:'Collaboration · Freebie Swap',
       when:'Best for warm connections people whose work you genuinely admire. Keep it mutual and specific. Mention their actual content to show it\'s not a copy-paste blast.',
       subjects:['I think your audience would love this?','Wanna share about [TOPIC] with your email list?','Fancy a freebie swap?','Real quick idea…'],
       body:`Hey [FIRST NAME]!

Hope this email finds you well!

I know we're already connected, but I wanted to reach out because I have an idea that I think could benefit both of our audiences: a freebie swap!

I have a [DESCRIPTION OF YOUR FREEBIE] that I believe your audience would find incredibly valuable. It's designed to [BRIEF BENEFIT], and it aligns perfectly with your recent content on [RELATED TOPIC].

Of course, I'd love to share one of your freebies with my list too. I'm confident that my audience who are mostly [YOUR IDEAL CLIENT DESCRIPTION] would really benefit from your expertise on [TOPIC].

Let me know if you're interested and we can chat details…

Looking forward to hearing from you!

[SIGNOFF]
[BUSINESS NAME]`},
      {name:'Warm Partnership: People You Know',hint:'Personal outreach to a real connection',eyebrow:'Collaboration · Warm Outreach',
       when:'Someone you\'ve actually met or spoken to before. Make it feel like a genuine catch-up by referencing something real and personal about them.',
       subjects:['Quick check-in and a thought 💡'],
       body:`Hi [FIRST NAME],

Happy New Year!

How was your holiday season? [ADD PERSONAL DETAIL e.g. "Did you and the family fall in love with Japan? I can't believe Susie is starting prep this year!"]

I've been thinking about how we could support each other's growth this year whether that's through a collab, cross-promotion, or just being in each other's corner in a bigger way.

Are you free for a quick Zoom soon? I'd love to chat and brainstorm.

[SIGNOFF]`},
      {name:'Warm Partnership Follow-Up',hint:'Follow up 3–4 days later',eyebrow:'Collaboration · Warm Follow-Up',
       when:'Send 3–4 days after your warm outreach email if no reply. Keep it light a gentle bump, not a chase.',
       subjects:['Just bumping this up in your inbox!','Following up no pressure at all'],
       body:`Hey [FIRST NAME],

Just popping back in case my last note got buried totally get it, this time of year is full on.

      {name:'"Can I Tell You Something Real"',hint:'No-pitch pure connection email',eyebrow:'Nurture · Pure Connection',
       when:'Use when you don\'t have anything to sell but want to show up. These are often the emails people save and reply to weeks later.',
       subjects:['Can I tell you something real?','This isn\'t a strategy… but it matters more'],
       body:`Hi [FIRST NAME]!

No big CTA. No launch. No master plan.

P.S. What's something that's been on your heart lately? If you feel like sharing, I'm all ears.`},

    desc:'From market research to the final countdown these emails prime your audience, build excitement, and convert without pressure. Use them in sequence for the smoothest possible launch.',

       subjects:['[FIRST NAME], quick q for you…','Can I help you with something?','What are you stuck on right now?'],
       body:`Hi [FIRST NAME]!

[THE STRATEGY, SHIFT, OR SUPPORT YOU PROVIDED keep it clear and grounded]

let curCat=0, curTpl=0;

function hl(t){return t.replace(/\[([^\]]+)\]/g,'<span class="ph">[$1]</span>')}

function buildNav(){
  document.getElementById('cats-inner').innerHTML=CATS.map((c,i)=>
    `<button class="cat-pill ${c.cls}${i===0?' active':''}" onclick="switchCat(${i})" aria-label="${c.label}">
      ${c.emoji} ${c.label}<span class="pill-count">${c.count}</span>
    </button>`
  ).join('');
}

function buildList(){
  const c=CATS[curCat];
  document.getElementById('list-label').textContent=c.label;
  document.getElementById('list-count').textContent=c.count+' templates';
  document.getElementById('tpl-list').innerHTML=c.templates.map((t,i)=>
    `<div class="tpl-row${i===curTpl?' active':''}" onclick="selectTpl(${i})" role="button" tabindex="0" aria-label="${t.name}">
      <div class="tpl-num">${String(i+1).padStart(2,'0')}</div>
      <div>
        <div class="tpl-row-name">${t.name}</div>
        <div class="tpl-row-hint">${t.hint}</div>
      </div>
    </div>`
  ).join('');
}

function buildContent(){
  const c=CATS[curCat], t=c.templates[curTpl];
  document.getElementById('content-panel').innerHTML=`
    <div class="cat-intro">
      <div class="cat-intro-title">${c.title}</div>
      <div class="cat-intro-script">${c.script}</div>
      <div class="cat-intro-desc">${c.desc}</div>
    </div>
    <div class="tpl-card">
      <div class="tpl-card-header">
        <div><span class="tpl-eyebrow">${t.eyebrow}</span></div>
        <div class="tpl-title">${t.name}</div>
        <div class="when-block">
          <div class="when-label">✦ When to use this</div>
          <div class="when-text">${t.when}</div>
        </div>
        <div class="subjects-block">
          <div class="subjects-label">Subject line options</div>
          ${t.subjects.map(s=>`<div class="subject-line">${hl(s)}</div>`).join('')}
        </div>
      </div>
      <div class="tpl-body">
        <div class="tpl-text">${hl(t.body)}</div>
      </div>
      <div class="tpl-footer">
        <button class="copy-btn" id="copy-btn" onclick="copyTpl()" aria-label="Copy template">
          ✦ Copy template
        </button>
        <div class="ph-note"><span class="ph-chip">[PLACEHOLDER]</span> = fill in before sending</div>
      </div>
    </div>`;
}

function switchCat(i){
  curCat=i; curTpl=0;
  document.querySelectorAll('.cat-pill').forEach((b,j)=>b.classList.toggle('active',j===i));
  buildList(); buildContent();
  window.scrollTo({top:0,behavior:'smooth'});
}

function selectTpl(i){
  curTpl=i;
  document.querySelectorAll('.tpl-row').forEach((r,j)=>r.classList.toggle('active',j===i));
  buildContent();
  document.getElementById('content-panel').scrollIntoView({behavior:'smooth',block:'start'});
}

function copyTpl(){
  const t=CATS[curCat].templates[curTpl];
  const text=`SUBJECT LINE OPTIONS:\n${t.subjects.join('\n')}\n\n---\n\n${t.body}`;
  navigator.clipboard.writeText(text).catch(()=>{
    const el=document.createElement('textarea');
    el.value=text;document.body.appendChild(el);el.select();
    document.execCommand('copy');document.body.removeChild(el);
  });
  const btn=document.getElementById('copy-btn');
  const orig=btn.innerHTML;
  btn.classList.add('copied');
  btn.innerHTML='✓ Copied!';
  setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML=orig;},2200);
}

buildNav(); buildList(); buildContent();
</script>
